name: Publish KM Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TOOLING_REPOSITORY: ThreeMonth03/dsw-km-translation-tool
  TOOLING_REF: d4621efdb3c771cea7fe9bc6979497d878d3db49

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: km-repo
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.TOOLING_REPOSITORY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling-repo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validator
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Validate Taiwan legal mapping
        run: >-
          tooling-repo/.venv/bin/dsw-km-validate-legal-mapping
          --mapping km-repo/legal-mapping.yml
          --km tooling-repo/tests/fixtures/source_inputs/dsw_root_2.7.0.km

      - name: Verify generated legal inventory
        run: |
          inventory="$RUNNER_TEMP/legal-question-inventory.yml"
          tooling-repo/.venv/bin/dsw-km-build-legal-inventory \
            --km tooling-repo/tests/fixtures/source_inputs/dsw_root_2.7.0.km \
            --rules km-repo/legal-inventory-rules.yml \
            --out "$inventory"
          diff --unified km-repo/legal-question-inventory.yml "$inventory"

      - name: Verify generated KM
        run: |
          draft="$RUNNER_TEMP/root-tw.km"
          tooling-repo/.venv/bin/python km-repo/scripts/build_draft.py \
            --repo-root km-repo \
            --tooling-repo tooling-repo \
            --source-km tooling-repo/tests/fixtures/source_inputs/dsw_root_2.7.0.km \
            --output "$draft"
          diff --unified km-repo/km/root-tw.km "$draft"

      - name: Validate immutable release boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          tooling-repo/.venv/bin/dsw-km-validate-release
          --repo-root km-repo
          --tag "$GITHUB_REF_NAME"
          --github-repository "$GITHUB_REPOSITORY"

      - name: Prepare versioned assets
        working-directory: km-repo
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          cp "km/root-tw.km" "$assets/tw-root-tw-${version}.km"
          cp "km/root-tw.km" "$assets/tw-root-tw.km"
          cp "release-manifest.yml" "$assets/release-manifest.yml"
          (
            cd "$assets"
            sha256sum "tw-root-tw-${version}.km" > "tw-root-tw-${version}.km.sha256"
            sha256sum "tw-root-tw.km" > "tw-root-tw.km.sha256"
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "$version" == 0.* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-assets/tw-root-tw-${version}.km" \
            "$RUNNER_TEMP/release-assets/tw-root-tw-${version}.km.sha256" \
            "$RUNNER_TEMP/release-assets/tw-root-tw.km" \
            "$RUNNER_TEMP/release-assets/tw-root-tw.km.sha256" \
            "$RUNNER_TEMP/release-assets/release-manifest.yml" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}"
