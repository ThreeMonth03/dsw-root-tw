name: Publish KM Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TOOLING_REPOSITORY: ThreeMonth03/dsw-km-translation-tool
  TOOLING_REF: 7c9b7aedace898284c10f02582eb64b43a25c65a

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: km-repo
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.TOOLING_REPOSITORY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling-repo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validator
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Validate Taiwan legal mapping
        run: >-
          tooling-repo/.venv/bin/dsw-km-validate-legal-mapping
          --mapping km-repo/legal-mapping.yml
          --km tooling-repo/tests/fixtures/source_inputs/dsw_root_2.7.0.km

      - name: Verify generated legal inventory
        run: |
          inventory="$RUNNER_TEMP/legal-question-inventory.yml"
          tooling-repo/.venv/bin/dsw-km-build-legal-inventory \
            --km tooling-repo/tests/fixtures/source_inputs/dsw_root_2.7.0.km \
            --rules km-repo/legal-inventory-rules.yml \
            --out "$inventory"
          diff --unified km-repo/legal-question-inventory.yml "$inventory"

      - name: Validate immutable release boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          tooling-repo/.venv/bin/dsw-km-validate-release
          --repo-root km-repo
          --tag "$GITHUB_REF_NAME"
          --github-repository "$GITHUB_REPOSITORY"

      - name: Prepare versioned assets
        working-directory: km-repo
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="$RUNNER_TEMP/root-tw-${version}.km"
          cp "km/root-tw.km" "$asset"
          sha256sum "$asset" > "${asset}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/root-tw-${GITHUB_REF_NAME#v}.km"
          "$RUNNER_TEMP/root-tw-${GITHUB_REF_NAME#v}.km.sha256"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
