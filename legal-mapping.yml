question_additions:
  - addition_id: tw-conditional-legal-routes
    parent_uuid: c3dabaaf-c946-4a0d-889c-ede966f97667
    topic: conditional-legal-routing
    status: proposed
    rationale: >-
      The inherited Science Europe structure lacks a single per-project
      screening point for Taiwan sector laws and foreign or funder obligations.
    authorities:
      - source_id: science-europe-rdm-guide
        provisions:
          - Core Requirements 4a-4c
      - source_id: human-subjects-research-act
      - source_id: medical-care-act
      - source_id: indigenous-peoples-basic-law
        provisions:
          - Article 21
      - source_id: indigenous-consultation-regulation
      - source_id: indigenous-research-regulation
      - source_id: animal-protection-act
      - source_id: iacuc-regulation
      - source_id: experimental-animal-sources
      - source_id: infectious-biological-materials
      - source_id: nhi-data-management-act
      - source_id: ai-fundamental-act
      - source_id: ai-risk-classification-framework
      - source_id: national-core-critical-technologies
      - source_id: national-security-act
        provisions:
          - Articles 3 and 8
      - source_id: core-technology-project-rules
      - source_id: strategic-high-tech-export-regulations
      - source_id: patent-act
      - source_id: archives-act
      - source_id: government-information-act
    question_type: MultiChoiceQuestion
    required_phase_uuid: b101f2d0-2476-452d-aa8d-95a41a02b52c
    tag_uuids: []
    proposed:
      title_en: Which additional Taiwan, foreign, or funder legal routes may apply to this research project?
      guidance_en: >-
        Select every possible route and obtain the responsible office's
        applicability decision. A selection is a screening flag, not a legal
        conclusion. Record the exact law, provision, approval, exemption,
        permit, contract, grant term, or non-applicability decision in the next
        question.
      choices:
        - choice_id: medical-human-trial
          label_en: Medical human trial or clinical research regulated by the Medical Care Act
        - choice_id: indigenous-peoples
          label_en: Indigenous Peoples, Indigenous land, resources, knowledge, or community participation
        - choice_id: scientific-use-of-animals
          label_en: Scientific use of animals or regulated animal-derived material
        - choice_id: infectious-or-regulated-material
          label_en: Infectious, imported, exported, wildlife, or otherwise regulated biological material
        - choice_id: national-health-insurance-data
          label_en: National Health Insurance data
        - choice_id: artificial-intelligence
          label_en: Artificial-intelligence research, training data, or a potentially high-risk AI use
        - choice_id: national-core-technology
          label_en: National core critical technology, related trade secret, or a government-funded core-technology project
        - choice_id: foreign-or-funder-rules
          label_en: Taiwan export control, foreign law, cross-border collaboration, contract, ethics, repository, or funder rules
        - choice_id: patent-before-disclosure
          label_en: Patent ownership or novelty review before publication or data disclosure
        - choice_id: public-records-and-information
          label_en: Public-agency archives, record disposal, overseas storage, or government-information disclosure
        - choice_id: none-or-undetermined
          label_en: None identified yet, or applicability is still undetermined

  - addition_id: tw-legal-determination-record
    parent_uuid: c3dabaaf-c946-4a0d-889c-ede966f97667
    topic: legal-determination-record
    status: proposed
    rationale: >-
      Screening flags are not auditable unless the project records who made
      each applicability decision and which controlled record supports it.
    authorities:
      - source_id: science-europe-rdm-guide
        provisions:
          - Core Requirements 4a-4c
      - source_id: nstc-research-ethics
    question_type: ValueQuestion
    required_phase_uuid: b101f2d0-2476-452d-aa8d-95a41a02b52c
    tag_uuids: []
    proposed:
      title_en: Record the project's legal and review determinations.
      guidance_en: >-
        For every selected or uncertain route, record the authority and exact
        provision or policy, why it applies or does not apply, required approval,
        exemption, permit, notice, agreement, or restriction, responsible
        institutional owner, decision-maker, date, review date, and controlled
        record location. Do not put participant-level or confidential facts in
        this summary.
      value_type: TextQuestionValueType
