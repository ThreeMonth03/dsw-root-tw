mappings:
  - source_uuid: dbb99f35-bdd9-4637-890e-23ba5bc19d6a
    source_title: Does the project require ethical approval?
    topic: review-routing
    action: rewrite
    status: proposed
    rationale: >-
      Processing personal data does not by itself prove that a Taiwan ethics
      approval is required. Human-subject research, animal scientific
      application, biobanks, Indigenous Peoples research, and institutional
      requirements need separate routing.
    authorities:
      - source_id: science-europe-rdm-guide
        provisions:
          - Core Requirement 4c
      - source_id: human-subjects-research-act
        provisions:
          - Articles 4-5
      - source_id: medical-care-act
        provisions:
          - Articles 78-80
      - source_id: animal-protection-act
        provisions:
          - Articles 15-16
      - source_id: human-biobank-management-act
        provisions:
          - Articles 4-6
      - source_id: indigenous-research-regulation
      - source_id: indigenous-peoples-basic-law
        provisions:
          - Article 21
    proposed:
      title_en: Does the project require ethics, competent-authority, or other statutory review?
      guidance_en: >-
        Check each applicable route separately: human-subject research and
        exemptions, a medical human trial, scientific use of animals,
        establishment or use of a human biobank, Indigenous Peoples or
        Indigenous land and knowledge, regulated biological materials, and
        institution or funder review. Do not infer an ethics-review requirement
        solely from the presence of personal data.

  - source_uuid: 49c009cb-a38c-4836-9780-8a8b3dd1cbac
    source_title: Will you collect any data connected to a person, "personal data"?
    topic: personal-data-scope
    action: rewrite
    status: proposed
    rationale: >-
      The Taiwan branch must use the statutory definition of personal data and
      distinguish the specially regulated categories in Article 6.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2 and 6
    proposed:
      title_en: Will the project collect, process, or use personal data that can identify a natural person?
      guidance_en: >-
        Apply the Taiwan Personal Data Protection Act definition, including
        information that identifies a person directly or indirectly. Assess
        medical records, healthcare, genetic, sexual-life, physical-examination,
        and criminal-record data separately under Article 6.

  - source_uuid: c8687abf-ac88-4bef-b1cc-7070bd039a07
    source_title: General Data Protection Regulation (GDPR) considerations
    topic: personal-data-framework
    action: replace
    status: proposed
    rationale: >-
      A Taiwan default questionnaire must not present GDPR roles and legal bases
      as if they were the domestic statutory framework.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2-6
          - Articles 8-9
          - Articles 15-16
          - Articles 19-21
          - Article 27
    proposed:
      title_en: Taiwan personal data protection review
      guidance_en: >-
        Identify whether the responsible organization is a public agency or a
        non-government agency, the specified purpose, the applicable basis for
        collection or processing, any different-purpose use, notice duties,
        data-subject rights, security measures, and cross-border or
        sector-specific restrictions.

  - source_uuid: c2da0410-ede1-4b0a-a750-09e6e6bd38cf
    source_title: What is the legal basis for processing the data under the GDPR?
    topic: personal-data-legal-basis
    action: replace
    status: proposed
    rationale: >-
      GDPR Article 6 answer choices do not map one-to-one to Taiwan law. Taiwan
      also uses different provisions for public and non-government agencies and
      a separate rule for Article 6 data.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 6
          - Articles 15-16
          - Articles 19-20
    proposed:
      title_en: What provision permits the planned collection, processing, and use of the personal data in Taiwan?
      guidance_en: >-
        Record the applicable provision and purpose for each responsible
        organization. Assess public agencies under Articles 15 and 16,
        non-government agencies under Articles 19 and 20, and Article 6
        categories separately. Consent is one possible basis, not a universal
        prerequisite or a substitute for research-ethics consent.

  - source_uuid: de72effc-807a-4081-b842-1e77ecc9c43f
    source_title: What are the exemptions to the prohibition for processing of special categories of data (such as health and genetic data) under Art. 9 GDPR used? State cohort/dataset for each type of exemption.
    topic: article-6-personal-data
    action: replace
    status: proposed
    rationale: >-
      Taiwan Article 6 categories and exceptions differ from GDPR Article 9 and
      must be asked in their own statutory terms.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 6
    proposed:
      title_en: Which Article 6 basis permits processing the specially regulated personal data?
      guidance_en: >-
        For each dataset, identify whether it contains medical records,
        healthcare, genetic, sexual-life, physical-examination, or criminal-record
        data and record the exact Article 6 basis relied on. Obtain institutional
        privacy or legal review where applicability is uncertain.

  - source_uuid: eccb8305-b78e-4e60-a4ee-094c70003b7a
    source_title: Who are the data controller(s) of the personal data processed in the project?
    topic: responsible-organizations
    action: replace
    status: proposed
    rationale: >-
      The domestic Act distinguishes public agencies from non-government
      agencies rather than importing the GDPR controller label unchanged.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 2
          - Articles 15-16
          - Articles 19-20
          - Article 27
    proposed:
      title_en: Which organizations are responsible for each personal-data operation in the project?
      guidance_en: >-
        Name each public agency or non-government agency that determines or
        performs collection, processing, or use. Record institutional roles,
        instructions, security obligations, and allocation of responsibility in
        collaboration or service agreements without assuming GDPR terminology.

  - source_uuid: 361c38f0-ce75-4157-94f1-804e4d7986c2
    source_title: Describe how data subjects exercise their rights to their data
    topic: data-subject-rights
    action: rewrite
    status: proposed
    rationale: >-
      Guidance should name the Taiwan statutory rights and connect them to
      notice and request-handling procedures.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 3
          - Articles 8-11
          - Article 13
    proposed:
      title_en: How can data subjects exercise their rights under Taiwan law?
      guidance_en: >-
        Describe the contact point and procedure for requests to inquire,
        review, copy, supplement or correct, stop collection, processing or use,
        and delete personal data. Record any lawful exception and align the
        process with the required notices. Under the currently effective
        Article 13, a query, review, or copy request is normally decided within
        15 days, and another rights request within 30 days; record any permitted
        extension and notice to the requester.

  - source_uuid: 15ade1cb-af43-40be-b8b1-2b801812dab1
    source_title: Do you plan to transfer data outside the EU/EEA?
    topic: cross-border-transfer
    action: replace
    status: proposed
    rationale: >-
      Taiwan does not use an EU/EEA boundary. General personal-data transfer and
      the stricter human-research and biobank routes must be separated.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 15-16
          - Articles 20-21
      - source_id: human-subjects-research-act
        provisions:
          - Article 19
      - source_id: human-biobank-management-act
        provisions:
          - Article 15
    proposed:
      title_en: Will personal data, human-research materials, or biobank data be transferred across borders?
      guidance_en: >-
        Identify the material, sender, recipient, country, purpose, safeguards,
        contracts, and responsible organization. For a public agency, record the
        statutory and use basis under Articles 15 and 16. For a non-government
        agency, also check restrictions issued under Article 21. If
        human-research material or a human biobank is involved, apply the
        additional consent, review, approval, and export rules rather than
        relying on the general answer alone.

  - source_uuid: 50864250-7dad-421a-9f6c-303114fe6e6c
    source_title: Does the data set include personal data?
    topic: reused-personal-data
    action: rewrite
    status: proposed
    rationale: >-
      Reused data remains in scope when a person can be identified directly or
      indirectly; Article 6 categories require a second check.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2 and 6
    proposed:
      title_en: Does the reused dataset contain personal data under Taiwan law?
      guidance_en: >-
        Consider whether any party can identify a natural person directly or
        indirectly, including by combining datasets. Separately identify any
        Article 6 categories before deciding the legal and ethics route.

  - source_uuid: 28e7c4f7-7ade-42b2-a68e-63ab4f67b960
    source_title: Does the consent cover your data reuse?
    topic: reuse-consent
    action: rewrite
    status: proposed
    rationale: >-
      The original flow treats consent too generically. Taiwan privacy,
      human-subject research, and biobank consent scopes are related but
      distinct.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 5 and 20
      - source_id: human-subjects-research-act
        provisions:
          - Article 19
      - source_id: human-biobank-management-act
        provisions:
          - Articles 7-8
          - Article 16
    proposed:
      title_en: Do the original permissions and approvals cover the planned reuse?
      guidance_en: >-
        Compare the new purpose, data, participants, recipients, location,
        retention, and disclosure with the original privacy notice, any consent,
        ethics approval, data-use agreement, and biobank terms. Determine
        separately whether new consent, review, notice, or another statutory
        basis is required.

  - source_uuid: c15710f6-1c7f-43a0-97e7-ab70f6b5a115
    source_title: Is a new approval or extension of any existing approval under research ethics laws needed for re-use of the data?
    topic: reuse-ethics-review
    action: rewrite
    status: proposed
    rationale: >-
      The reuse question should route reviewers to the Taiwan definition,
      exemption notices, and secondary-use rule.
    authorities:
      - source_id: human-subjects-research-act
        provisions:
          - Articles 4-5
          - Article 19
    proposed:
      title_en: Does the planned reuse require a new or amended Taiwan ethics review?
      guidance_en: >-
        Check whether the reuse is human-subject research, whether an announced
        exemption applies, whether retained materials remain linked, and whether
        the original approval covers the new purpose and disclosures. Record the
        responsible review body and decision.

  - source_uuid: ebcbf4c6-ce25-4a0b-9e82-039a88498203
    source_title: Is the data collection subject to ethical legislation?
    topic: ethics-applicability
    action: replace
    status: proposed
    rationale: >-
      A single generic ethics-legislation branch can miss Taiwan's distinct
      statutory and institutional review routes.
    authorities:
      - source_id: science-europe-rdm-guide
        provisions:
          - Core Requirement 4c
      - source_id: human-subjects-research-act
        provisions:
          - Articles 4-5
      - source_id: medical-care-act
        provisions:
          - Articles 78-80
      - source_id: human-biobank-management-act
        provisions:
          - Articles 4-6
      - source_id: indigenous-research-regulation
      - source_id: nstc-research-ethics
    proposed:
      title_en: Which Taiwan legal, ethics, institutional, or funder review routes apply to this collection?
      guidance_en: >-
        Review human-subject research, human biobanks, research involving
        medical human trials, Indigenous Peoples or Indigenous land and
        knowledge, applicable institutional review rules, and funder ethics
        requirements separately. Record exemptions and determinations, not only
        approvals.

  - source_uuid: b464593d-fb92-4ad9-88e1-764306bb3051
    source_title: Does the collection of data involve human subjects?
    topic: human-subject-research
    action: rewrite
    status: proposed
    rationale: >-
      The question should use the Taiwan statutory definition, which covers
      research using human specimens and specified categories of information,
      not only direct interaction.
    authorities:
      - source_id: human-subjects-research-act
        provisions:
          - Articles 4-5
    proposed:
      title_en: Does the project meet the Taiwan definition of human-subject research?
      guidance_en: >-
        Include research that obtains, investigates, analyzes, or uses human
        specimens or an individual's biological, behavioral, physiological,
        psychological, genetic, or medical information. Record the ethics-review
        determination or announced exemption before research begins.

  - source_uuid: a2b1fa38-792a-4628-9765-93476a38cffb
    source_title: Have informed consents been collected from the research subjects?
    topic: human-research-consent
    action: rewrite
    status: proposed
    rationale: >-
      Taiwan requirements depend on the research route and participant group;
      privacy notice, privacy legal basis, and research consent must not be
      collapsed into one checkbox.
    authorities:
      - source_id: human-subjects-research-act
        provisions:
          - Articles 12-15
      - source_id: human-biobank-management-act
        provisions:
          - Articles 6-8
      - source_id: indigenous-research-regulation
      - source_id: pdpa-current
        provisions:
          - Articles 8-9
          - Articles 15 and 19
    proposed:
      title_en: Have all required research consents, consultations, and personal-data notices been completed?
      guidance_en: >-
        Record human-subject research consent or an applicable exception,
        biobank consent where relevant, Indigenous consultation and consent where
        applicable, and the separate Personal Data Protection Act notice and
        statutory basis. Preserve the approved versions and dates.

  - source_uuid: 3782d32b-91b5-432f-8f93-92bb22868a22
    source_title: Is the collection covered by ethical review?
    topic: ethics-review-record
    action: rewrite
    status: proposed
    rationale: >-
      The answer should record both approvals and exemption or
      non-applicability determinations with their scope and version.
    authorities:
      - source_id: human-subjects-research-act
        provisions:
          - Articles 5 and 7
      - source_id: human-biobank-management-act
        provisions:
          - Article 5
    proposed:
      title_en: What review, exemption, or non-applicability decision covers the collection?
      guidance_en: >-
        Record the review body or competent authority, protocol identifier,
        decision, scope, conditions, approved consent materials, dates, and
        amendments. Link to controlled records rather than exposing participant
        information.

  - source_uuid: cc57d7c0-49db-4546-958f-e9407eaf93ee
    source_title: Will the samples be stored in a local repository such as a biobank?
    topic: human-biobank
    action: rewrite
    status: proposed
    rationale: >-
      A generic local repository is not automatically a legally established
      human biobank, and the Taiwan Act governs linked specimens and data,
      approvals, security, use, and international transfer.
    authorities:
      - source_id: human-biobank-management-act
        provisions:
          - Articles 3-6
          - Articles 11-18
    proposed:
      title_en: Will human specimens and linked data be stored in, or obtained from, a human biobank?
      guidance_en: >-
        Identify the permitted biobank operator, ethics and competent-authority
        approvals, participant consent scope, coding and security controls,
        intended uses, third-party access, and any international transmission.
        Do not label an ordinary sample repository a statutory human biobank
        without confirmation.

  - source_uuid: 3788d53f-c79f-43d2-b67b-7479f05cddb0
    source_title: Can all data be legally transported and processed at the computing site?
    topic: processing-location
    action: rewrite
    status: proposed
    rationale: >-
      The site decision must cover Taiwan privacy rules, research-material
      restrictions, contracts, and conditional sector requirements rather than
      an unspecified legality check.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 20-21
          - Article 27
      - source_id: human-subjects-research-act
        provisions:
          - Article 19
      - source_id: human-biobank-management-act
        provisions:
          - Articles 13 and 15
    proposed:
      title_en: Can every dataset and research material lawfully be transferred to and processed at the selected computing site?
      guidance_en: >-
        Check purpose and recipient restrictions, security controls, contracts,
        cross-border transfer, ethics and consent scope, human-research overseas
        provision, and biobank approval. Record which data must remain in a
        controlled environment or be accessed remotely.

  - source_uuid: d5990471-0618-42cd-92cb-bbbfd4f61532
    source_title: Are personal data sufficiently protected?
    topic: personal-data-security
    action: rewrite
    status: proposed
    rationale: >-
      Security guidance must reference the currently effective Act while
      tracking the promulgated but not-yet-effective 2025 amendment.
    authorities:
      - source_id: pdpa-amendment-comparison
        provisions:
          - Currently effective Articles 18 and 27
      - source_id: pdpa-2025-amendment
      - source_id: human-biobank-management-act
        provisions:
          - Articles 11-13
          - Article 18
    proposed:
      title_en: Are the personal data protected by risk-appropriate technical and organizational measures?
      guidance_en: >-
        Document access control, least privilege, separation of identifiers,
        encryption, logging, backup, incident handling, deletion, supplier
        controls, and re-identification risk. Distinguish the duties of
        government agencies from those of non-government agencies and apply
        sector rules where relevant. Recheck the effective date and implementing
        rules of the 2025 Personal Data Protection Act amendment before release.

  - source_uuid: cb7d17a8-30c0-489d-a43c-702b27d97611
    source_title: How are the rights of the collected data arranged?
    topic: intellectual-property-and-contracts
    action: rewrite
    status: proposed
    rationale: >-
      EU database-right assumptions must not be copied. Taiwan review should
      distinguish unprotected facts, protected expression or creative
      compilations, contracts, trade secrets, and government-funded R&D terms.
    authorities:
      - source_id: copyright-act
        provisions:
          - Article 7
          - Article 10-1
          - Articles 11-12
      - source_id: trade-secrets-act
        provisions:
          - Articles 2-5
      - source_id: fundamental-science-technology-act
        provisions:
          - Article 6
      - source_id: patent-act
        provisions:
          - Articles 7 and 22
      - source_id: national-security-act
        provisions:
          - Articles 3 and 8
      - source_id: national-core-critical-technologies
      - source_id: core-technology-project-rules
    proposed:
      title_en: How are ownership, copyright, confidentiality, and authorized uses of the research outputs allocated?
      guidance_en: >-
        Review contracts and institutional or funder terms. Distinguish facts and
        methods from protected expression and creative compilations; identify
        employee, commissioned, and collaborative ownership; assess trade-secret
        and patent-before-disclosure conditions; check whether a national core
        critical technology route applies; and document licenses or data-use
        permissions. Do not assume an EU sui-generis database right applies in
        Taiwan.

  - source_uuid: d4e6a244-07fb-4573-b93f-c20a9409ac7c
    source_title: How long will this data set be kept?
    topic: retention-and-deletion
    action: rewrite
    status: proposed
    rationale: >-
      Retention is not only a preservation preference. Purpose expiry,
      research-material rules, withdrawal, agreements, and approved archival
      needs can produce different outcomes.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 11
      - source_id: human-subjects-research-act
        provisions:
          - Article 19
      - source_id: human-biobank-management-act
        provisions:
          - Articles 8 and 14
      - source_id: nstc-research-ethics
      - source_id: archives-act
        provisions:
          - Articles 5 and 10-12
    proposed:
      title_en: What retention and deletion rule applies to this dataset and its identifiers?
      guidance_en: >-
        Record the purpose, legal or contractual minimum and maximum periods,
        ethics or biobank conditions, participant withdrawal handling, archival
        justification, review date, deletion method, and who authorizes an
        extension. Treat identifiers, research data, consent records, and audit
        records separately where required. A public university or other public
        agency must also check the Archives Act before destroying or moving
        official records abroad.

  - source_uuid: cc95b399-7d8d-4232-bccf-686f78c91bff
    source_title: Does this dataset contain sensitive information?
    topic: sensitive-information
    action: rewrite
    status: proposed
    rationale: >-
      Legally regulated Article 6 personal data should not be conflated with
      other sensitive research information such as endangered-species locations
      or trade secrets.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 6
      - source_id: trade-secrets-act
        provisions:
          - Article 2
      - source_id: science-europe-rdm-guide
        provisions:
          - Core Requirements 4a-4c
      - source_id: wildlife-conservation-act
      - source_id: national-security-act
        provisions:
          - Article 3
      - source_id: national-core-critical-technologies
    proposed:
      title_en: Does this dataset contain legally regulated personal data or other sensitive information?
      guidance_en: >-
        Classify Article 6 personal data separately from other personal data,
        confidential information, trade secrets, security-sensitive data, or
        sensitive ecological and cultural information, protected-wildlife
        locations, and national core critical technology information. Record
        the reason, applicable controls, access route, and disclosure limits for
        each class.

  - source_uuid: 63b6e695-2371-412c-bed3-f13e157da0b4
    source_title: Data use restrictions
    topic: reuse-restrictions
    action: rewrite
    status: proposed
    rationale: >-
      Reuse restrictions should be traced to their actual source instead of
      being recorded as an undifferentiated free-text limitation.
    authorities:
      - source_id: science-europe-rdm-guide
        provisions:
          - Core Requirements 4a-4c
      - source_id: pdpa-current
        provisions:
          - Article 20
      - source_id: human-subjects-research-act
        provisions:
          - Article 19
      - source_id: human-biobank-management-act
        provisions:
          - Article 16
    proposed:
      title_en: What restrictions govern access, use, linkage, disclosure, and onward sharing?
      guidance_en: >-
        For each restriction, record whether it comes from law, consent, ethics
        approval, a biobank, contract, license, confidentiality, or institutional
        policy; its scope and duration; the decision-maker; the access procedure;
        and whether a machine-readable data-use term can represent it.

  - source_uuid: a1d76760-053c-4706-80a2-cfb6c6a061f3
    source_title: Does this dataset contain personal data?
    topic: retention-of-personal-data
    action: rewrite
    status: proposed
    rationale: >-
      The preservation decision must use Taiwan's identifiability test and
      purpose-expiry rule instead of presenting GDPR retention exemptions as
      Taiwan law.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2 and 11
    proposed:
      title_en: Does this preserved dataset contain personal data under Taiwan law?
      guidance_en: >-
        Determine whether a natural person can be identified directly,
        indirectly, or by combining this dataset with other information.
        Document the original purpose, retention basis, review date, access
        controls, and the Article 11 reason for retaining, deleting, or stopping
        use after the purpose disappears or the retention period expires.

  - source_uuid: be4651c9-9a8c-4e10-a158-61b94ca0e139
    source_title: What legal basis are you using to collect and process the personal data?
    topic: personal-data-legal-basis
    action: replace
    status: proposed
    rationale: >-
      GDPR Article 6 answer logic is not a statement of Taiwan law. The
      questionnaire must direct reviewers to the applicable Taiwan provision,
      organization type, specified purpose, and operation.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 6-9
          - Articles 15-16
          - Articles 19-20
    proposed:
      title_en: What statutory basis and specified purpose apply to each personal-data operation?
      guidance_en: >-
        For each collection, processing, and use, identify the responsible
        public or non-government agency, the specified purpose, and the exact
        applicable provision. Assess Article 6 data separately. Record any
        consent relied on, but do not treat consent as the only possible basis
        or as a substitute for research-ethics consent.

  - source_uuid: 9e0fb0fd-0268-4cf3-8dfa-ba0b2a1e8e89
    source_title: Under what GDPR category does the project data fall?
    topic: personal-data-categories
    action: replace
    status: proposed
    rationale: >-
      GDPR standard and special-category terminology does not match the
      categories specially regulated by Article 6 of Taiwan's Act.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2 and 6
    proposed:
      title_en: Which Taiwan personal-data categories does the project handle?
      guidance_en: >-
        Inventory directly or indirectly identifying information and separately
        flag medical records, healthcare, genetic, sexual-life,
        physical-examination, and criminal-record data listed in Article 6.
        Other highly sensitive information may still require stronger controls
        even when it is not an Article 6 category.

  - source_uuid: 8915bd25-db22-4ed6-bcc8-b1bbdc52989e
    source_title: Do you need a Data Protection Impact Assessment?
    topic: privacy-risk-assessment
    action: replace
    status: proposed
    rationale: >-
      A GDPR DPIA must not be shown as a universal Taiwan statutory
      requirement. High-risk projects should still record any assessment
      required by applicable law, sector rules, an institution, or a funder.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 5, 18, and 27
      - source_id: pdpa-amendment-comparison
    proposed:
      title_en: Is a privacy or data-protection risk assessment required or warranted?
      guidance_en: >-
        Do not assume the GDPR DPIA rule applies. Check current Taiwan law,
        sector-specific rules, ethics conditions, contracts, and institutional
        policy. Even when no named assessment is mandatory, document the risk
        review for large-scale, linked, highly identifiable, Article 6, or
        otherwise high-impact processing, and recheck the effective status of
        the 2025 Personal Data Protection Act amendment.

  - source_uuid: 6cc96576-2535-46b3-8c9b-a12703ee96cc
    source_title: Have Data Protection Impact Assessments (DPIA) been performed for the personal data?
    topic: privacy-risk-assessment
    action: replace
    status: proposed
    rationale: >-
      The follow-up should record the assessment actually required or selected,
      without forcing GDPR terminology.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 5, 18, and 27
      - source_id: pdpa-amendment-comparison
    proposed:
      title_en: Has the required or planned privacy risk assessment been completed?
      guidance_en: >-
        Record its scope, owner, legal or policy trigger, datasets, findings,
        mitigation measures, residual risk, approval, review date, and location
        of the controlled assessment record.

  - source_uuid: 8cc50031-87d5-4b0e-8c3c-c7ded35fd263
    source_title: List DPIAs done and for which parts of the data.
    topic: privacy-risk-assessment
    action: replace
    status: proposed
    rationale: >-
      The assessment register should be neutral about the legal instrument that
      required each assessment.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 5, 18, and 27
    proposed:
      title_en: List the privacy risk assessments and the data or operations each one covers.
      guidance_en: >-
        Add one item for each assessment and identify its scope and controlled
        record. Do not place participant-level information in this list.

  - source_uuid: 432c867e-8f29-47e6-9078-05bdf3d3fcb0
    source_title: DPIA
    topic: privacy-risk-assessment
    action: replace
    status: proposed
    rationale: >-
      A neutral item label accommodates statutory, ethics, contractual, and
      institutional assessments.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 5, 18, and 27
    proposed:
      title_en: Assessment
      guidance_en: >-
        Enter the assessment title, identifier, owner, status, and controlled
        record location.

  - source_uuid: 3d09f311-07dd-49a0-8445-5eab8f9548fc
    source_title: Why is a DPIA deemed necessary for this project?
    topic: privacy-risk-assessment
    action: replace
    status: proposed
    rationale: >-
      The risk-factor question is useful, but it must not imply that GDPR
      criteria are Taiwan statutory triggers.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 5, 18, and 27
      - source_id: pdpa-amendment-comparison
    proposed:
      title_en: Why is this privacy risk assessment required or warranted?
      guidance_en: >-
        Select all factual risk factors that apply, then separately record the
        Taiwan law, sector rule, ethics condition, contract, or institutional
        policy that requires the assessment. Treat the listed factors as risk
        prompts rather than statutory conclusions.

  - source_uuid: c6e30ba1-10d6-4f3c-b81a-5f2b362f74cd
    source_title: Have data processing agreements been (or will they be) established between the data controller(s) and any data processors?
    topic: commissioned-processing
    action: replace
    status: proposed
    rationale: >-
      Taiwan's Act uses commissioned processing and responsible-organization
      concepts rather than GDPR controller-processor terminology.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 4, 18, and 27
      - source_id: pdpa-enforcement-rules
        provisions:
          - Articles 8 and 12
    proposed:
      title_en: Are written terms and oversight in place for commissioned processing and service providers?
      guidance_en: >-
        Identify every party commissioned to collect, process, or use personal
        data. Document instructions, purpose and scope, access and
        confidentiality controls, subcontracting, incident duties, return or
        deletion, audit rights, and the responsible organization's oversight.
        Also apply sector-specific security requirements where relevant.

  - source_uuid: a21efb45-5238-4e9a-a00c-28d3d88d801b
    source_title: List processors and agreements established
    topic: commissioned-processing
    action: replace
    status: proposed
    rationale: >-
      The register should identify commissioned parties and governing terms
      without relying on GDPR role names.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 4, 18, and 27
    proposed:
      title_en: List commissioned parties, service providers, and the governing terms.
      guidance_en: >-
        Record the party, service, data, purpose, contract or other terms,
        security controls, subcontractors, oversight owner, and end-of-service
        handling.

  - source_uuid: 8c27e2cc-d2a7-45da-9829-aa22566bb34b
    source_title: Processor
    topic: commissioned-processing
    action: replace
    status: proposed
    rationale: >-
      The item should use a role label that remains meaningful under Taiwan law.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 4
    proposed:
      title_en: Commissioned party or service provider
      guidance_en: >-
        Identify the legal entity, contact, assigned operations, processing
        location, and any subcontractors.

  - source_uuid: 61d21b4f-332b-4257-a345-bbf51b10d357
    source_title: Explain how data subjects will be informed.
    topic: personal-data-notice
    action: replace
    status: proposed
    rationale: >-
      Taiwan's direct- and indirect-collection notice rules and exemptions
      should replace the GDPR right-to-information statement.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 8-9
    proposed:
      title_en: How and when will each data subject receive the required Taiwan privacy notice?
      guidance_en: >-
        For direct collection, cover the organization, purpose, data
        categories, period, territory, recipients, methods, Article 3 rights and
        how to exercise them, and the effect of not providing optional data. For
        indirect collection, also record the source and timing. Cite and justify
        any Article 8 or 9 notice exception.

  - source_uuid: db902645-6aef-426a-aa2c-30e96a4b3afb
    source_title: Describe the measures put in place to protect data
    topic: cross-border-safeguards
    action: replace
    status: proposed
    rationale: >-
      Cross-border safeguards must be tied to Taiwan law, research approvals,
      consent, contracts, and the actual recipient instead of GDPR compliance.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 5, 20-21, and 27
      - source_id: human-subjects-research-act
        provisions:
          - Article 19
      - source_id: human-biobank-management-act
        provisions:
          - Articles 13 and 15
    proposed:
      title_en: Describe the legal, contractual, technical, and procedural safeguards for the transfer.
      guidance_en: >-
        Identify the sender, recipient, country, data or material, purpose,
        access controls, encryption, onward-transfer limits, return or deletion,
        incident duties, audit arrangements, and responsible organization.
        Record any Taiwan competent-authority restriction, ethics or consent
        condition, human-research overseas-provision rule, or biobank approval.

  - source_uuid: 0f1c1125-b87f-4d88-a8b0-865f2161f604
    source_title: Controller
    topic: responsible-organizations
    action: replace
    status: proposed
    rationale: >-
      The list label should not impose a GDPR role classification.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2 and 4
    proposed:
      title_en: Responsible organization
      guidance_en: >-
        Add each public agency, non-government agency, or commissioned party and
        describe its actual collection, processing, or use role.

  - source_uuid: 23fb6248-31ca-40b6-bb1a-40d77706ebb0
    source_title: Please  specify  the controller(s)
    topic: responsible-organizations
    action: replace
    status: proposed
    rationale: >-
      Taiwan review needs the responsible organizations and commissioned
      parties, not an assumed GDPR controller list.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2 and 4
    proposed:
      title_en: Specify the responsible organizations and commissioned parties.
      guidance_en: >-
        Record each legal entity, whether it is a public or non-government
        agency, its operations and purposes, and any commissioning relationship.

  - source_uuid: 6cc336d2-2ae1-4ba7-92bf-00307c48dbdf
    source_title: Controller
    topic: responsible-organizations
    action: replace
    status: proposed
    rationale: >-
      The item label should use Taiwan statutory organization concepts.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2 and 4
    proposed:
      title_en: Responsible organization
      guidance_en: >-
        Identify the organization and document its purposes, operations, and
        responsibilities.

  - source_uuid: 312ad81e-a274-4523-a6b2-2299e56422b7
    source_title: Is there more than one controller of the personal data processed in the project?
    topic: responsible-organizations
    action: replace
    status: proposed
    rationale: >-
      Multiple participating organizations should be analyzed by their actual
      Taiwan-law roles and arrangements.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2 and 4
    proposed:
      title_en: Is more than one organization responsible for personal-data operations in the project?
      guidance_en: >-
        Identify the operations and specified purposes of each organization and
        any commissioning relationship. Do not infer a GDPR joint-controller
        classification.

  - source_uuid: bdb07de8-6b54-41ac-b89d-21e089f01597
    source_title: Will the parties be joint controllers?
    topic: shared-responsibility
    action: replace
    status: proposed
    rationale: >-
      Collaboration duties should be documented without importing the GDPR
      joint-controller test.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2, 4, and 27
    proposed:
      title_en: Do the parties share decisions or responsibilities for personal-data operations?
      guidance_en: >-
        Describe who determines each purpose and method, who performs each
        operation, who answers data-subject requests, and who manages security
        and incidents. Obtain institutional legal review for the allocation.

  - source_uuid: 0dda3f9c-7567-47c8-8726-23fdfbe67e33
    source_title: Has a joint controllership agreement between the parties been established?
    topic: shared-responsibility
    action: replace
    status: proposed
    rationale: >-
      The agreement should allocate actual responsibilities without assuming a
      GDPR joint-controllership classification.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2, 4, and 27
    proposed:
      title_en: Has a written responsibility arrangement between the parties been established?
      guidance_en: >-
        Allocate purposes, operations, notices, rights requests, security,
        incident handling, retention, deletion, onward sharing, oversight, and
        points of contact. Link to the controlled agreement.

  - source_uuid: 2418a1b7-6950-4a19-8e58-6c5089c71b53
    source_title: Select exemption
    topic: article-6-personal-data
    action: replace
    status: proposed
    rationale: >-
      The inherited answers compress GDPR Article 9 exemptions into labels that
      do not state Taiwan Article 6 conditions.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 6
    proposed:
      title_en: Which exact Article 6 exception applies?
      guidance_en: >-
        Select the closest route, then record the exact Article 6 subparagraph,
        the supporting facts, and any written-consent, public-interest,
        research, or non-identifiability condition. If no route clearly fits,
        stop processing and obtain institutional privacy or legal review.

  - source_uuid: 12baa8af-db59-43a5-8ec7-0941c58ff89a
    source_title: Will metadata be available openly?
    topic: open-metadata
    action: rewrite
    status: proposed
    rationale: >-
      Horizon Europe requirements must not be presented as a default Taiwan
      legal duty, although they may still bind a particular funded project.
    authorities:
      - source_id: science-europe-rdm-guide
        provisions:
          - Core Requirements 2 and 5
    proposed:
      title_en: Will metadata be openly available under the applicable funder and repository terms?
      guidance_en: >-
        Identify the actual funder, grant, repository, and metadata-license
        requirements. Use CC0 or another open term only when it is appropriate
        and permitted; do not expose personal, confidential, security-sensitive,
        protected ecological or cultural, or national core technology
        information. Record the reason for any restriction.

  - source_uuid: a20ddc5d-e883-4bc4-9948-36a2cb477d10
    source_title: Did you consider the possible impact to the project or organization if information leaks?
    topic: security-incident-response
    action: rewrite
    status: proposed
    rationale: >-
      The generic impact prompt should produce an actionable incident plan and
      distinguish currently effective duties from pending PDPA amendments.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Article 12
      - source_id: pdpa-enforcement-rules
        provisions:
          - Articles 12 and 22
      - source_id: pdpa-2025-amendment
      - source_id: cyber-security-2025-amendment
    proposed:
      title_en: Is there a documented security-incident assessment, response, and notification plan?
      guidance_en: >-
        Identify the incident owner, containment and evidence steps, affected
        data and systems, commissioned-party escalation, decision records, and
        notification route. Apply the currently effective PDPA Article 12 and
        Enforcement Rules; track the promulgated 2025 PDPA reporting duties
        separately until effective. Apply the Cyber Security Management Act
        only if the organization is a public agency or designated specific
        non-public agency.

  - source_uuid: 0e810343-6026-4992-8ea0-5539cbc77093
    source_title: Will you be collecting physical samples?
    topic: regulated-research-materials
    action: rewrite
    status: proposed
    rationale: >-
      Physical samples can trigger distinct human, animal, infectious-material,
      wildlife, Indigenous, import/export, and repository requirements that a
      generic storage question does not identify.
    authorities:
      - source_id: human-subjects-research-act
        provisions:
          - Articles 4-5 and 19
      - source_id: medical-care-act
        provisions:
          - Articles 78-80
      - source_id: human-biobank-management-act
        provisions:
          - Articles 3-6 and 11-18
      - source_id: animal-protection-act
        provisions:
          - Articles 15-16
      - source_id: iacuc-regulation
      - source_id: experimental-animal-sources
      - source_id: infectious-biological-materials
      - source_id: wildlife-conservation-act
      - source_id: strategic-high-tech-export-regulations
      - source_id: indigenous-peoples-basic-law
        provisions:
          - Article 21
    proposed:
      title_en: Will the project collect, receive, store, transfer, or export physical research materials?
      guidance_en: >-
        Classify human specimens, medical human-trial material, human-biobank
        material, animals or animal-derived material, infectious biological
        material, protected wildlife, geological or cultural material, and
        other specimens separately. Record source, consent or permit, review
        body, transport and import/export controls, storage, linkage to data,
        access, retention, disposal, and Indigenous consultation where
        applicable.

content_overrides:
  - source_uuid: 5a119b74-fdb6-464c-9267-8a68b8a2cf8d
    source_type: reference
    topic: personal-data-legal-basis
    status: proposed
    rationale: Replace inherited GDPR guidance with the official Taiwan statute.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 6, 15-16, and 19-20
    source_fields:
      label: Legal bases for personal data processing under GDPR
      url: https://advisera.com/eugdpracademy/knowledgebase/is-consent-needed-six-legal-bases-to-process-data-according-to-gdpr/
    proposed_fields:
      label: Currently effective Taiwan Personal Data Protection Act
      url: https://law.moj.gov.tw/LawClass/LawOldVer.aspx?pcode=I0050021

  - source_uuid: ca0df149-cb95-404a-a925-0a1fc5052d1d
    source_type: answer
    topic: anonymization
    status: proposed
    rationale: Use Taiwan's direct-or-indirect identifiability test.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2, 5, and 27
    source_fields:
      advice: Note that it is very hard to make data anonymous, and GDPR requires that you regularly verify that it is still anonymous.
    proposed_fields:
      advice: >-
        Anonymization is difficult to establish in practice. Reassess whether a
        person can be identified directly, indirectly, or by combining the data
        with other information, and maintain risk-appropriate controls while
        re-identification remains reasonably possible.

  - source_uuid: 44348fa8-fd12-49ea-ad7f-48ff88215829
    source_type: answer
    topic: anonymization
    status: proposed
    rationale: Use Taiwan's direct-or-indirect identifiability test.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 2, 5, and 27
    source_fields:
      advice: |-
        Please note that GDPR law in Europe specifies that data is only anonymous as long as nobody in the world has enough information to re-identify the subject.

        Furthermore, GDPR requires that you regularly verify that it is still anonymous.
    proposed_fields:
      advice: >-
        Record the anonymization method, separation of identifiers, available
        auxiliary information, and residual re-identification risk. Reassess
        identifiability when data, recipients, linkage sources, or technology
        change.

  - source_uuid: 73cd2dda-41ba-456b-9a4e-aa34c78f2fcf
    source_type: answer
    topic: consent
    status: proposed
    rationale: Replace GDPR consent advice with Taiwan privacy and research-consent distinctions.
    authorities:
      - source_id: pdpa-current
        provisions:
          - Articles 6-9, 15-16, and 19-20
      - source_id: human-subjects-research-act
        provisions:
          - Articles 12-15
    source_fields:
      advice: "Traditionally, *consent* has been the basis for processing personal data for research, but under the GDPR there cannot be an imbalance between the processor and the data subject for it to be considered to be freely given. In some countries the use of *consent* as the legal basis for processing by universities for research purposes is therefore not recommended. In those cases, public interest should probably be your legal basis. Note that if your legal basis for processing is consent, [a number of requirements](https://gdpr-info.eu/issues/consent/) exists for the consent to be considered valid under the GDPR. Consents given before the GDPR might not live up to this. \n\nNote that consent needs to be completely voluntary. If the subject gets any service or good in return for their permission, this is not considered consent. Also note that in European (GDPR) law, a data subject should be able to retract their consent at any moment."
    proposed_fields:
      advice: >-
        Record the exact Taiwan provision for each collection, processing, and
        use; consent is one possible basis, not a universal default. Assess
        Article 6 written consent separately, preserve proof of the required
        notice, and do not treat a privacy-law basis as a substitute for
        human-subject research consent or ethics approval.

